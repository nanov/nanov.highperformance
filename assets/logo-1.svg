<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Gradient representing speed and the .NET ecosystem -->
    <linearGradient id="nanovGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
  </defs>

  <!-- Dark background container (optional, fits developer/GitHub themes) -->
  <rect width="100%" height="100%" fill="#0B0F19" rx="12"/>

  <g transform="translate(10, 0)">
    <!-- Graphical Icon (Geometric N + V + Nano Dot) -->
    <g transform="translate(50, 45)">
      <!-- Left pillar of N -->
      <path d="M20 130 L60 30 L95 30 L55 130 Z" fill="url(#nanovGradient)" opacity="0.7" />
      <!-- Middle diagonal/V shape -->
      <path d="M55 130 L115 30 L150 30 L90 130 Z" fill="url(#nanovGradient)" />
      <!-- Right fast-forward accent -->
      <path d="M120 70 L145 30 L180 30 L155 70 Z" fill="url(#nanovGradient)" opacity="0.5" />
      <!-- The Nano/Low-Allocation Dot -->
      <circle cx="185" cy="30" r="10" fill="#00D2FF" />
    </g>

    <!-- Typography -->
    <g transform="translate(280, 115)">
      <!-- Main Brand Name -->
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="1">Nanov</text>
      <!-- Subtitle -->
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#00D2FF" letter-spacing="6.5" x="5" y="45">HIGH PERFORMANCE</text>
    </g>
  </g>
</svg>
